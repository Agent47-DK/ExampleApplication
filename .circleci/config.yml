version: 2.1

workflows:
  version: 2
  build:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main

jobs:
  build:
    working_directory: ~/ExampleApplication

    docker:
      - image: cimg/node:26.13.0

    steps:
      - checkout
      - run:
          name: Check Node and npm versions
          command: |
            node --version
            npm --version
      - restore_cache:
          keys:
            - npm-deps-{{ checksum "ExampleApplication/package.json" }}

      - run:
          name: update-npm
          command: |
            cd ExampleApplication && npm install -g npm@latest
      - restore_cache:
          key: dependency-cache-{{ checksum "ExampleApplication/package-lock.json" }}
      - run:
          name: install-npm
          command: |
            cd ExampleApplication && npm install
      - save_cache:
          key: dependency-cache-{{ checksum "ExampleApplication/package-lock.json" }}
          paths:
            - ./ExampleApplication/node_modules
